name: app-task

services:
  postgres:
    image: postgres:16
    container_name: app-task-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5434:5432'
    volumes:
      - ./backend/db/postgres_data:/var/lib/postgresql/data
    networks:
      - task_app_net
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: app-task-pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_ADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - '8083:80'
    networks:
      - task_app_net
    restart: always
    volumes:
      - ./backend/db/pgadmin_data:/var/lib/pgadmin

  # Servicio de AWS (S3) para gestionar documentos, fotos, entre otros archivos
  aws-local-s3:
    container_name: s3-local
    image: localstack/localstack:latest
    ports:
      - "${AWS_STORAGE_SERVICE_PORT}:4566" # Puerto unificado de LocalStack
    environment:
      - LOCALSTACK_AUTH_TOKEN=${AWS_LOCAL_TOKEN}
      - SERVICES=${AWS_STORAGE_SERVICE}
      - AWS_DEFAULT_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-app-task-bucket-local}
    volumes:
      - "./backend/aws/aws-s3-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./backend/aws/localstack-init:/etc/localstack/init/ready.d:ro"
    networks:
      - task_app_net
    restart: always

  backend:
    depends_on:
      - aws-local-s3
      - postgres
    env_file:
      - .env
    build: 
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: app-task-backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - AWS_S3_ENDPOINT=http://aws-local-s3:4566
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-app-task-bucket-local}
    command: npm run start:dev
    networks:
      - task_app_net
    restart: always

  frontend:
    depends_on:
      - postgres
      - backend
    build: 
      context: ./user-web-portal
      dockerfile: Dockerfile.dev
    container_name: app-task-frontend
    ports:
      - '4200:4200'
    networks:
      - task_app_net
    restart: always
    volumes:
      - ./user-web-portal:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run start -- --host 0.0.0.0 --poll 2000

volumes:
  postgres_data:
  pgadmin_data:

networks:
  task_app_net:
    driver: bridge
    enable_ipv6: true
