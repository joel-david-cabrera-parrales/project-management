@if (open()) {
  <div class="workspace-drawer-layer" (click)="requestClose()">
    <aside class="workspace-drawer" role="dialog" aria-modal="true" [attr.aria-label]="titleKey() | translate"
      (click)="$event.stopPropagation()">
      <header class="workspace-drawer-header">
        <div class="workspace-drawer-heading">
          <span class="workspace-drawer-accent" aria-hidden="true"><i></i><i></i><i></i></span>
          <h2>{{ titleKey() | translate }}</h2>
        </div>
        <button class="workspace-drawer-close" type="button" [disabled]="busy()"
          [attr.aria-label]="'common.close' | translate" (click)="requestClose()">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg>
        </button>
      </header>
      <section class="workspace-drawer-body"><ng-content select="[drawer-body]" /></section>
      <footer class="workspace-drawer-footer"><ng-content select="[drawer-footer]" /></footer>
    </aside>
  </div>
}
