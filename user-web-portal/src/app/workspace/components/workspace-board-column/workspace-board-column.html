<section class="workspace-board-column" [attr.aria-label]="list().title">
  <header class="board-column-header">
    <div class="board-column-title">
      <span aria-hidden="true"></span>
      @if (editingTitle()) {
        <input
          #titleInput
          class="board-column-title-input"
          type="text"
          maxlength="150"
          [value]="titleDraft()"
          [attr.aria-label]="'workspace.taskList.rename' | translate"
          (input)="titleDraft.set($any($event.target).value)"
          (blur)="saveTitle()"
          (keydown.enter)="saveTitle()"
          (keydown.escape)="cancelEditTitle()" />
      } @else {
        <h2
          [class.board-column-title-editable]="canManage()"
          [appTooltip]="list().title"
          (dblclick)="startEditTitle()">
          {{ list().title }}
        </h2>
      }
      <span class="board-column-count">{{ list().tasks.length }}</span>
    </div>
    <div class="board-column-actions">
      @if (canManage()) {
        <button class="board-column-add" type="button" [attr.aria-label]="'workspace.taskList.addTask' | translate"
          [appTooltip]="'workspace.taskList.addTask' | translate" (click)="createTask.emit(list())">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3v14M3 10h14"/></svg>
        </button>
      }
      @if (canDelete()) {
        <button class="board-column-delete" type="button" [attr.aria-label]="'workspace.taskList.delete' | translate"
          [appTooltip]="'workspace.taskList.delete' | translate" (click)="deleteList.emit(list().id)">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16"/></svg>
        </button>
      }
    </div>
  </header>
  <div class="board-column-tasks"
    cdkDropList
    [id]="'workspace-task-list-' + list().id"
    [cdkDropListData]="list()"
    [cdkDropListDisabled]="!canManage()"
    (cdkDropListDropped)="onDrop($event)">
    @for (task of list().tasks; track task.taskId) {
      <div class="board-task-drag-item"
        cdkDrag
        [cdkDragData]="task"
        [cdkDragDisabled]="!canManage()"
        [class.board-task-draggable]="canManage()">
        <div class="board-task-drag-placeholder" *cdkDragPlaceholder></div>
        <app-workspace-task-card [task]="task" [canEdit]="canManage()" [canDelete]="canDelete()"
          (edit)="editTask.emit({ task, list: list() })" (delete)="deleteTask.emit($event)"
          (toggleCompleted)="toggleTaskCompleted.emit($event)" />
      </div>
    } @empty {
      <div class="board-column-empty">
        <span>{{ 'workspace.board.noTasksInColumn' | translate }}</span>
        @if (canManage()) {
          <button type="button" (click)="createTask.emit(list())">{{ 'workspace.taskList.addTask' | translate }}</button>
        }
      </div>
    }
  </div>
</section>
