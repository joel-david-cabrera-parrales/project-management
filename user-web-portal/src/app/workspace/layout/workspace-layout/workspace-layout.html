<div class="workspace-layout">
  <header class="workspace-header">
    <a class="workspace-brand" routerLink="/workspace" [attr.aria-label]="appName">
      <span class="workspace-brand-mark" aria-hidden="true">✦</span>
      <span>{{ appName }}</span>
    </a>

    <div class="workspace-header-actions">
      <p class="workspace-header-caption">{{ 'workspace.layout.caption' | translate }}</p>
      <button class="workspace-language-button" type="button" (click)="toggleLanguage()"
        [attr.aria-label]="'auth.brand.toggleLanguage' | translate">
        {{ translation.currentLang() | uppercase }}
        <span aria-hidden="true">⌄</span>
      </button>
    </div>
  </header>

  <main class="workspace-main">
    <router-outlet />
  </main>

  <footer class="workspace-footer">{{ 'workspace.layout.footer' | translate: { appName: appName } }}</footer>
</div>
