<div class="app-shell">
  @if (!isWorkspaceDetail()) {
    <app-workspace-topbar />
  }
  <main class="app-shell-content" [class.app-shell-content-detail]="isWorkspaceDetail()">
    <router-outlet />
  </main>
  <app-workspace-create-modal [open]="workspaceStore.createModalOpen()"
    (close)="workspaceStore.createModalOpen.set(false)" (created)="onWorkspaceCreated()" />
</div>
